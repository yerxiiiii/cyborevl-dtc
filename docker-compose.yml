services:
  cuddolab:
    build: .
    restart: unless-stopped
    init: true # 正确转发信号 + 回收僵尸进程
    env_file:
      - .env
    ports:
      # 公开服务：建议前置 nginx + HTTPS（见 DEPLOY.md）
      - "127.0.0.1:3000:3000"
      # 后台服务：只绑本机，绝不直接对公网暴露
      - "127.0.0.1:3001:3001"
    volumes:
      # 持久化数据库与备份（容器重建也不丢数据）
      - ./data:/data
    # 给优雅关闭留足时间（server.js 内有 10s 强制退出兜底）
    stop_grace_period: 15s
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
